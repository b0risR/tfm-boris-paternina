# Configuracion de Mosquitto para el pipeline IoT.
#
# ---------------------------------------------------------------------------
# Listeners
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# Listener WebSockets: no lo usa el pipeline, pero permite inspeccionar el
# trafico con clientes de navegador durante el desarrollo.
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Autenticacion
# ---------------------------------------------------------------------------
# Entorno de desarrollo local y aislado: sin autenticacion. En un despliegue
# real esto se sustituiria por password_file o autenticacion TLS mutua.
allow_anonymous true

# ---------------------------------------------------------------------------
# Persistencia
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 1

# ---------------------------------------------------------------------------
# Limites y colas
# ---------------------------------------------------------------------------
max_inflight_messages 200
max_queued_messages 10000
message_size_limit 0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
